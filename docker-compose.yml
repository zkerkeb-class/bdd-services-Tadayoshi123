services:
  db-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supervia-db-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_SERVICES=${ALLOWED_SERVICES}
    networks:
      - supervia-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  supervia-network:
    external: true
    name: infra_supervia-network # Le nom correct du réseau partagé 